<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#07111f">
    <title>Page not found · DeepTelecom</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #07111f; color: #ecf7ff; }
      main { width: min(90%, 38rem); padding: 3rem; border: 1px solid #1f3e55; border-radius: 1.5rem; background: #0b1a2b; box-shadow: 0 2rem 6rem #0007; }
      span { color: #52d6b5; font-size: .82rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: .65rem 0; font-size: clamp(2.2rem, 8vw, 4.5rem); line-height: 1; }
      p { color: #a8bfd0; font-size: 1.05rem; line-height: 1.7; }
      a { display: inline-block; margin-top: 1rem; padding: .8rem 1rem; border-radius: .7rem; background: #52d6b5; color: #07111f; font-weight: 800; text-decoration: none; }
      a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <span>Error 404</span>
      <h1>Signal lost.</h1>
      <p>The page you requested is not part of this DeepTelecom release.</p>
      <a id="home-link" href="./">Return to the dataset</a>
    </main>
    <script>
      (() => {
        const firstPathSegment = window.location.pathname.split("/").filter(Boolean)[0];
        if (firstPathSegment) document.getElementById("home-link").href = `/${firstPathSegment}/`;
      })();
    </script>
  </body>
</html>
