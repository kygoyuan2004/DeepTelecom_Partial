<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#07151d">
    <title>页面未找到 · DeepTelecom</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #07151d; color: #ecf7f5; }
      main { width: min(90%, 38rem); padding: 3rem; border: 1px solid #1d3b44; border-radius: 1.5rem; background: #0d232c; box-shadow: 0 2rem 6rem #0007; }
      span { color: #6ee7c4; font-size: .82rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: .65rem 0; font-size: clamp(2.2rem, 8vw, 4.5rem); line-height: 1; }
      p { color: #9db8bd; font-size: 1.05rem; line-height: 1.7; }
      a { display: inline-block; margin-top: 1rem; padding: .8rem 1rem; border-radius: .7rem; background: #6ee7c4; color: #07151d; font-weight: 800; text-decoration: none; }
      a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <span>Error 404 · Signal lost</span>
      <h1>没有找到这个页面。</h1>
      <p>你访问的地址不属于当前 DeepTelecom 站点。可以返回项目首页，继续查看数据、样本画廊与生成方法。</p>
      <a id="home-link" href="./">返回数据集首页</a>
    </main>
    <script>
      (() => {
        const firstPathSegment = window.location.pathname.split("/").filter(Boolean)[0];
        if (firstPathSegment) document.getElementById("home-link").href = `/${firstPathSegment}/`;
      })();
    </script>
  </body>
</html>
